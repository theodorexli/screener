image: node:20

cache:
  paths:
    - node_modules/

pages:
  stage: deploy
  # Set these in your CI/CD project variables (do not commit production values):
  #   VITE_WORKER_URL
  #   VITE_PREDICTIONS_WORKER_URL
  #   VITE_PUBLIC_POSTHOG_KEY (optional)
  script:
    - |
      if [ -z "$VITE_WORKER_URL" ]; then
        echo "VITE_WORKER_URL is required. Set it in your CI/CD project variables."
        exit 1
      fi
    - npm ci
    - npm run build
    - rm -rf public
    - mv dist public
    - cp public/index.html public/404.html
  artifacts:
    paths:
      - public
  only:
    - main
